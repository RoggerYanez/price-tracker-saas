<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceTracker | SaaS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 flex h-screen overflow-hidden">

    <!-- Sidebar Lateral -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="px-6 py-5 border-b border-slate-800">
                <h1 class="text-lg font-bold text-white flex items-center gap-2">
                    📊 PriceTracker <span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded text-white">PRO</span>
                </h1>
            </div>
            <nav class="px-4 py-6 space-y-1">
                <a href="#" onclick="cambiarVista('productos')" id="nav-productos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium transition">
                    📦 Productos
                </a>
                <a href="#" onclick="cambiarVista('clientes')" id="nav-clientes" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">
                    👥 Clientes
                </a>
                <a href="#" onclick="cambiarVista('ganancias')" id="nav-ganancias" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">
                    💰 Ganancias
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
            Sesión iniciada como Admin
        </div>
    </aside>

    <!-- Contenido Principal -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        
        <!-- Header superior -->
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
            <h2 id="titulo-vista" class="text-xl font-bold text-slate-800">Monitoreo de Productos</h2>
            <div class="flex items-center gap-4">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Activo
                </span>
                <button onclick="cargarDatos()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-lg font-medium shadow transition">
                    🔄 Actualizar
                </button>
            </div>
        </header>

        <!-- Cuerpo Dinámico -->
        <main class="p-8 max-w-7xl w-full mx-auto space-y-6">
            
            <!-- Tarjetas de Resumen (KPIs) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Productos Rastreados</p>
                    <p id="kpi-productos" class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Clientes Activos</p>
                    <p class="text-2xl font-bold text-indigo-600 mt-1">2 / 2</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ganancia Mensual Est.</p>
                    <p class="text-2xl font-bold text-emerald-600 mt-1">S/ 150.00</p>
                </div>
            </div>

            <!-- Sección principal de contenido -->
            <div id="seccion-contenido" class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="px-6 py-3">Producto</th>
                            <th class="px-6 py-3">Precio Actual</th>
                            <th class="px-6 py-3">Última Revisión</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos" class="divide-y divide-slate-200 text-sm">
                        <tr><td colspan="3" class="px-6 py-4 text-center text-slate-400">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script>
        let productosGlobal = [];

        async function cargarDatos() {
            try {
                const response = await fetch('/api/productos');
                productosGlobal = await response.json();
                
                document.getElementById('kpi-productos').innerText = productosGlobal.length;
                renderizarTablaProductos();
            } catch (error) {
                console.error("Error al cargar datos:", error);
            }
        }

        function renderizarTablaProductos() {
            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';

            if (productosGlobal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-slate-400">No hay productos registrados todavía.</td></tr>`;
                return;
            }

            productosGlobal.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${item.producto}</td>
                    <td class="px-6 py-4 text-emerald-600 font-bold">S/ ${item.precio.toFixed(2)}</td>
                    <td class="px-6 py-4 text-slate-500 text-xs">${item.fecha}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiarVista(vista) {
            // Cambiar estilos de los botones del menú
            ['productos', 'clientes', 'ganancias'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (v === vista) {
                    btn.className = "flex items-center gap-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium transition";
                } else {
                    btn.className = "flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition";
                }
            });

            const titulo = document.getElementById('titulo-vista');
            const contenedor = document.getElementById('seccion-contenido');

            if (vista === 'productos') {
                titulo.innerText = "Monitoreo de Productos";
                contenedor.innerHTML = `
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                <th class="px-6 py-3">Producto</th>
                                <th class="px-6 py-3">Precio Actual</th>
                                <th class="px-6 py-3">Última Revisión</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos" class="divide-y divide-slate-200 text-sm"></tbody>
                    </table>`;
                renderizarTablaProductos();
            } else if (vista === 'clientes') {
                titulo.innerText = "Gestión de Clientes";
                contenedor.innerHTML = `
                    <div class="p-6">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="px-4 py-3">Cliente</th>
                                    <th class="px-4 py-3">Empresa</th>
                                    <th class="px-4 py-3">Estado</th>
                                    <th class="px-4 py-3">Plan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 text-sm">
                                <tr>
                                    <td class="px-4 py-4 font-medium text-slate-800">Carlos Mendoza</td>
                                    <td class="px-4 py-4 text-slate-600">Librería El Ateneo</td>
                                    <td class="px-4 py-4"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold">Activo</span></td>
                                    <td class="px-4 py-4 text-slate-600">Pro (S/ 75/mes)</td>
                                </tr>
                                <tr>
                                    <td class="px-4 py-4 font-medium text-slate-800">Lucía Torres</td>
                                    <td class="px-4 py-4 text-slate-600">Comercializadora Sur</td>
                                    <td class="px-4 py-4"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold">Activo</span></td>
                                    <td class="px-4 py-4 text-slate-600">Pro (S/ 75/mes)</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>`;
            } else if (vista === 'ganancias') {
                titulo.innerText = "Control de Ganancias y Facturación";
                contenedor.innerHTML = `
                    <div class="p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <h4 class="text-sm font-bold text-slate-700">Ingresos Totales del Mes</h4>
                                <p class="text-3xl font-extrabold text-emerald-600 mt-2">S/ 150.00</p>
                                <p class="text-xs text-slate-400 mt-1">Actualizado hoy</p>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <h4 class="text-sm font-bold text-slate-700">Costos de Servidores / Nube</h4>
                                <p class="text-3xl font-extrabold text-rose-600 mt-2">S/ 0.00 <span class="text-xs font-normal text-slate-500">(Plan Gratuito)</span></p>
                                <p class="text-xs text-slate-400 mt-1">Margen de ganancia: 100%</p>
                            </div>
                        </div>
                    </div>`;
            }
        }

        cargarDatos();
    </script>
</body>
</html>
