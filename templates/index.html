<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceTracker | SaaS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-900 h-screen overflow-hidden">

    <!-- PANTALLA DE ACCESO (LOGIN / REGISTRO) -->
    <div id="pantalla-login" class="flex items-center justify-center h-full bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">📊 PriceTracker <span class="text-xs bg-indigo-600 px-2 py-0.5 rounded text-white">PRO</span></h2>
            <p id="subtitulo-auth" class="text-sm text-slate-500 text-center mb-6">Inicia sesión para continuar</p>
            
            <!-- Formulario de Login -->
            <form id="form-login-element" onsubmit="realizarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuario</label>
                    <input type="text" id="login-user" required placeholder="Tu usuario" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="login-pass" required placeholder="•••••" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow">Ingresar</button>
                <div class="text-center pt-2">
                    <button type="button" onclick="alternarAuth('registro')" class="text-xs text-indigo-600 hover:underline">¿No tienes cuenta? Regístrate aquí</button>
                </div>
            </form>

            <!-- Formulario de Registro (Oculto por defecto) -->
            <form id="form-registro-element" onsubmit="realizarRegistro(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nuevo Usuario</label>
                    <input type="text" id="reg-user" required placeholder="Crea tu usuario" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="reg-pass" required placeholder="•••••" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow">Crear Cuenta de Cliente</button>
                <div class="text-center pt-2">
                    <button type="button" onclick="alternarAuth('login')" class="text-xs text-slate-600 hover:underline">¿Ya tienes cuenta? Inicia sesión</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="panel-principal" class="hidden flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="px-6 py-5 border-b border-slate-800">
                    <h1 class="text-lg font-bold text-white flex items-center gap-2">
                        📊 PriceTracker <span class="text-[10px] bg-indigo-600 px-2 py-0.5 rounded text-white" id="badge-rol">PRO</span>
                    </h1>
                </div>
                <nav class="px-4 py-6 space-y-1" id="menu-lateral">
                    <!-- Dinámico según rol -->
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span id="info-usuario">Usuario</span>
                <button onclick="cerrarSesion()" class="text-red-400 hover:text-red-300 font-medium">Cerrar Sesión</button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
                <h2 id="titulo-vista" class="text-xl font-bold text-slate-800">Panel</h2>
                <div class="flex items-center gap-4">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Activo
                    </span>
                    <button onclick="cargarDatos()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-lg font-medium shadow transition">
                        🔄 Actualizar
                    </button>
                </div>
            </header>

            <main class="p-8 max-w-7xl w-full mx-auto space-y-6">
                <!-- KPIs Dinámicos -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kpis-container">
                    <!-- Se llena con JS según el rol -->
                </div>

                <div id="seccion-contenido" class="space-y-6"></div>
            </main>
        </div>
    </div>

    <script>
        let productosGlobal = [];
        let usuarioActual = null;

        function alternarAuth(modo) {
            if (modo === 'registro') {
                document.getElementById('form-login-element').classList.add('hidden');
                document.getElementById('form-registro-element').classList.remove('hidden');
                document.getElementById('subtitulo-auth').innerText = 'Regístrate como nuevo cliente';
            } else {
                document.getElementById('form-registro-element').classList.add('hidden');
                document.getElementById('form-login-element').classList.remove('hidden');
                document.getElementById('subtitulo-auth').innerText = 'Inicia sesión para continuar';
            }
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    usuarioActual = data;
                    iniciarSesionExitosa();
                } else {
                    alert("Credenciales incorrectas.");
                }
            } catch (error) {
                alert("Error al conectar con el servidor.");
            }
        }

        async function realizarRegistro(event) {
            event.preventDefault();
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
                    alternarAuth('login');
                } else {
                    const err = await response.json();
                    alert(err.detail || "Error al registrarse.");
                }
            } catch (error) {
                alert("Error al conectar con el servidor.");
            }
        }

        function iniciarSesionExitosa() {
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('panel-principal').classList.remove('hidden');
            document.getElementById('info-usuario').innerText = `${usuarioActual.username} (${usuarioActual.rol})`;
            document.getElementById('badge-rol').innerText = usuarioActual.rol.toUpperCase();

            const menu = document.getElementById('menu-lateral');
            menu.innerHTML = '';

            if (usuarioActual.rol === 'admin') {
                menu.innerHTML = `
                    <a href="#" onclick="cambiarVista('admin-dashboard')" id="nav-admin-dashboard" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium transition">📊 Resumen Negocio</a>
                    <a href="#" onclick="cambiarVista('clientes')" id="nav-clientes" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">👥 Clientes</a>
                    <a href="#" onclick="cambiarVista('ganancias')" id="nav-ganancias" class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition">💰 Ganancias</a>
                `;
                cambiarVista('admin-dashboard');
            } else {
                menu.innerHTML = `
                    <a href="#" onclick="cambiarVista('productos')" id="nav-productos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium transition">📦 Mis Productos</a>
                `;
                cambiarVista('productos');
            }
            cargarDatos();
        }

        function cerrarSesion() {
            usuarioActual = null;
            document.getElementById('panel-principal').classList.add('hidden');
            document.getElementById('pantalla-login').classList.remove('hidden');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
        }

        async function cargarDatos() {
            try {
                const response = await fetch('/api/productos');
                productosGlobal = await response.json();
                if (usuarioActual.rol === 'cliente' && document.getElementById('tabla-productos')) {
                    renderizarTablaProductos();
                    document.getElementById('kpi-prod-cliente').innerText = productosGlobal.length;
                }
            } catch (error) {
                console.error("Error cargando datos:", error);
            }
        }

        function renderizarTablaProductos() {
            const tbody = document.getElementById('tabla-productos');
            if(!tbody) return;
            tbody.innerHTML = '';

            if (productosGlobal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-slate-400">No hay productos registrados todavía.</td></tr>`;
                return;
            }

            productosGlobal.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${item.producto}</td>
                    <td class="px-6 py-4 text-emerald-600 font-bold">S/ ${item.precio.toFixed(2)}</td>
                    <td class="px-6 py-4 text-slate-500 text-xs">${item.fecha}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiarVista(vista) {
            const titulo = document.getElementById('titulo-vista');
            const kpis = document.getElementById('kpis-container');
            const contenedor = document.getElementById('seccion-contenido');

            // Actualizar estilo botones menú
            ['admin-dashboard', 'clientes', 'ganancias', 'productos'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if(btn) {
                    btn.className = (v === vista) 
                        ? "flex items-center gap-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-medium transition"
                        : "flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition";
                }
            });

            if (vista === 'productos' && usuarioActual.rol === 'cliente') {
                titulo.innerText = "Mis Productos Rastreados";
                kpis.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-2">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tus Productos en Seguimiento</p>
                        <p id="kpi-prod-cliente" class="text-2xl font-bold text-slate-800 mt-1">${productosGlobal.length}</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Estado de cuenta</p>
                        <p class="text-2xl font-bold text-emerald-600 mt-1">Plan Estándar</p>
                    </div>
                `;
                contenedor.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-md font-bold text-slate-800 mb-4">Agregar Nuevo Producto a Rastrear</h3>
                        <form id="form-agregar" onsubmit="registrarProducto(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input type="text" id="nombre-prod" placeholder="Nombre del producto" required class="border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-600">
                            <input type="url" id="url-prod" placeholder="https://ejemplo.com/producto" required class="border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-600">
                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg px-4 py-2 shadow transition">Guardar y Rastrear</button>
                        </form>
                    </div>
                    <div class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="px-6 py-3">Producto</th>
                                    <th class="px-6 py-3">Precio Actual</th>
                                    <th class="px-6 py-3">Última Revisión</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-productos" class="divide-y divide-slate-200 text-sm"></tbody>
                        </table>
                    </div>`;
                renderizarTablaProductos();
            } else if (vista === 'admin-dashboard' && usuarioActual.rol === 'admin') {
                titulo.innerText = "Panel de Control de Administrador";
                kpis.innerHTML = `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Clientes Totales</p>
                        <p class="text-2xl font-bold text-slate-800 mt-1">2</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ganancia Mensual Est.</p>
                        <p class="text-2xl font-bold text-emerald-600 mt-1">S/ 150.00</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Estado Servidor</p>
                        <p class="text-2xl font-bold text-indigo-600 mt-1">Operativo</p>
                    </div>
                `;
                contenedor.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-slate-600">Bienvenido al panel central de administración. Usa el menú lateral para revisar los clientes o ingresos.</div>`;
            } else if (vista === 'clientes' && usuarioActual.rol === 'admin') {
                titulo.innerText = "Gestión de Clientes";
                kpis.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-3"><p class="text-sm text-slate-500">Listado general de cuentas registradas en la plataforma.</p></div>`;
                contenedor.innerHTML = `
                    <div class="bg-white shadow-sm rounded-xl border border-slate-200 p-6">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                    <th class="px-4 py-3">Cliente / Usuario</th>
                                    <th class="px-4 py-3">Estado</th>
                                    <th class="px-4 py-3">Rol</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 text-sm">
                                <tr>
                                    <td class="px-4 py-4 font-medium text-slate-800">cliente1</td>
                                    <td class="px-4 py-4"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold">Activo</span></td>
                                    <td class="px-4 py-4 text-slate-600">Cliente</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>`;
            } else if (vista === 'ganancias' && usuarioActual.rol === 'admin') {
                titulo.innerText = "Control de Ganancias";
                kpis.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-3"><p class="text-sm text-slate-500">Desglose de ingresos mensuales percibidos por el SaaS.</p></div>`;
                contenedor.innerHTML = `
                    <div class="bg-white shadow-sm rounded-xl border border-slate-200 p-6">
                        <p class="text-3xl font-extrabold text-emerald-600">S/ 150.00 <span class="text-sm font-normal text-slate-500">Ingresos Totales del Mes</span></p>
                    </div>`;
            }
        }

        async function registrarProducto(event) {
            event.preventDefault();
            const nombre = document.getElementById('nombre-prod').value;
            const url = document.getElementById('url-prod').value;

            const response = await fetch('/api/agregar-producto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, url })
            });

            if (response.ok) {
                alert("¡Producto registrado con éxito!");
                document.getElementById('form-agregar').reset();
                cargarDatos();
            } else {
                alert("Hubo un error al registrar el producto.");
            }
        }
    </script>
</body>
</html>
